<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Youropp Africa — Legal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #F8F9FA;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #1E293B;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 12px 24px rgba(211, 47, 47, 0.08);
    }
    .logo {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, #D32F2F, #B71C1C);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 28px;
      font-weight: 800;
      margin: 0 auto 24px;
    }
    h1 { font-size: 22px; text-align: center; margin-bottom: 8px; }
    p { color: #64748B; font-size: 14px; text-align: center; line-height: 1.6; margin-bottom: 24px; }
    a {
      display: block;
      padding: 16px 20px;
      background: #F8F9FA;
      border-radius: 12px;
      text-decoration: none;
      color: #1E293B;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 10px;
      border: 1px solid #E2E8F0;
      transition: all 0.15s;
    }
    a:hover { background: #FFEBEE; border-color: #D32F2F; }
    .footer { text-align: center; color: #A8A8A8; font-size: 11px; margin-top: 24px; }

</html>
